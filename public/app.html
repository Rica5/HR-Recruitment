<!DOCTYPE html>
<html lang="fr" data-theme="solumada">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recrutement RH</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">

  <!-- Overlay mobile sidebar -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" style="display:flex;flex-direction:column;align-items:center;padding:18px 16px 14px;gap:6px">
      <div class="sidebar-logo-box">
        <img id="sidebar-logo-img" src="" alt="Recrutement RH" style="max-height:36px;max-width:160px;object-fit:contain;display:block">
      </div>
      <div class="logo-sub" style="font-size:11px;letter-spacing:.1em">RECRUTEMENT RH</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label" id="nav-label-main"></div>
        <button class="nav-item" data-page="dashboard" onclick="navigate('dashboard')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span id="nav-dashboard"></span>
        </button>
        <button class="nav-item" data-page="offres" onclick="navigate('offres')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span id="nav-offres"></span>
          <span class="nav-badge" id="nb-offres">0</span>
        </button>
        <button class="nav-item" data-page="candidatures" onclick="navigate('candidatures')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0"/></svg>
          <span id="nav-candidatures"></span>
          <span class="nav-badge" id="nb-cands">0</span>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-label" id="nav-label-tracking"></div>
        <button class="nav-item" data-page="rendezvous" onclick="navigate('rendezvous')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="nav-rendezvous"></span>
        </button>
        <button class="nav-item" data-page="batch-cv" onclick="navigate('batch-cv')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span id="nav-batch-cv"></span>
        </button>
        <button class="nav-item" data-page="audit" onclick="navigate('audit')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span id="nav-audit"></span>
        </button>
      </div>

      <div class="nav-section">
        <div class="nav-label" id="nav-label-account"></div>
        <button class="nav-item" data-page="users" onclick="navigate('users')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <span id="nav-users"></span>
        </button>
        <button class="nav-item" data-page="settings" onclick="navigate('settings')">
          <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="nav-settings"></span>
        </button>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="theme-switcher" style="display:none">
        <button class="theme-btn" data-theme="solumada" onclick="switchTheme('solumada')">🌿 Solumada</button>
        <button class="theme-btn" data-theme="optimum" onclick="switchTheme('optimum')">🔵 Optimum</button>
      </div>
      <div class="user-card" onclick="navigate('settings')">
        <div class="user-avatar" id="user-avatar">?</div>
        <div>
          <div class="user-name" id="user-name">—</div>
          <div class="user-role" id="nav-role-label"></div>
        </div>
        <svg style="margin-left:auto;width:14px;height:14px;color:var(--text-3);flex-shrink:0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;min-width:0">
        <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menu">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div style="min-width:0">
          <div class="topbar-title" id="topbar-title">Dashboard</div>
          <div class="topbar-sub" id="topbar-sub"></div>
        </div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="page-content" id="page-content">
      <div style="display:flex;align-items:center;justify-content:center;height:300px">
        <div class="spinner" style="width:32px;height:32px"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/i18n.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/offres.js"></script>
<script src="/js/pages/candidatures.js"></script>
<script src="/js/pages/audit.js"></script>
<script src="/js/pages/settings.js"></script>
<script src="/js/pages/users.js"></script>
<script src="/js/pages/rendezvous.js"></script>
<script src="/js/pages/batch-cv.js"></script>
<script>
if (!requireAuth()) throw new Error('redirect');

const user = Auth.user();
if (user) {
  document.getElementById('user-avatar').textContent = initials(user.nom);
  document.getElementById('user-name').textContent = user.nom;
  const cfg = COMPANY_CONFIG[user.company] || COMPANY_CONFIG.solumada;
  const sidebarLogo = document.getElementById('sidebar-logo-img');
  if (sidebarLogo) { sidebarLogo.src = cfg.logo; sidebarLogo.alt = cfg.name; }
  applyTheme(cfg.theme);
}

// Populate sidebar nav labels (translated)
(function initNavLabels() {
  const set = (id, key) => { const el = document.getElementById(id); if (el) el.textContent = t(key); };
  set('nav-label-main',     'nav.section.main');
  set('nav-label-tracking', 'nav.section.tracking');
  set('nav-label-account',  'nav.section.account');
  set('nav-dashboard',      'nav.dashboard');
  set('nav-offres',         'nav.offers');
  set('nav-candidatures',   'nav.applications');
  set('nav-rendezvous',     'nav.appointments');
  set('nav-batch-cv',       'nav.import_cvs');
  set('nav-audit',          'nav.history');
  set('nav-users',          'nav.users');
  set('nav-settings',       'nav.settings');
  set('nav-role-label',     'nav.role.admin');
})();

// Load badge counts
async function loadCounts() {
  const r = await api.get('/api/offres/stats/summary');
  if (r?.success) {
    document.getElementById('nb-offres').textContent = r.stats.activeOffers;
    document.getElementById('nb-cands').textContent = r.stats.totalApplications;
  }
}

// Sidebar mobile
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// Router
const PAGES = {
  dashboard:    { title: t('page.dashboard.title'),    sub: t('page.dashboard.sub'),    action: '', render: renderDashboard },
  offres:       { title: t('page.offers.title'),       sub: t('page.offers.sub'),       action: `<button class="btn btn-primary btn-sm" onclick="openCreateOffer()">${t('btn.new_offer')}</button>`, render: renderOffers },
  candidatures: { title: t('page.applications.title'), sub: t('page.applications.sub'), action: '', render: renderApplications },
  rendezvous:   { title: t('page.appointments.title'), sub: t('page.appointments.sub'), action: '', render: renderRDV },
  audit:        { title: t('page.history.title'),      sub: t('page.history.sub'),      action: '', render: renderAudit },
  users:        { title: t('page.users.title'),        sub: t('page.users.sub'),        action: '', render: renderUsers },
  settings:     { title: t('page.settings.title'),     sub: t('page.settings.sub'),     action: '', render: renderSettings },
  'batch-cv':   { title: t('page.batch_cv.title'),     sub: t('page.batch_cv.sub'),     action: '', render: renderBatchCV },
};

function navigate(page) {
  closeSidebar();
  const p = PAGES[page] || PAGES.dashboard;
  history.pushState({ page }, '', page === 'dashboard' ? '/' : '/' + page);
  document.title = p.title + ' — Recrutement RH';
  document.getElementById('topbar-title').textContent = p.title;
  document.getElementById('topbar-sub').textContent = p.sub;
  document.getElementById('topbar-actions').innerHTML = p.action;
  setActiveNav(page);
  p.render();
}

window.addEventListener('popstate', e => navigate(e.state?.page || 'dashboard'));

// Init
loadCounts();
const initPage = location.pathname.replace(/^\//, '') || 'dashboard';
navigate(Object.keys(PAGES).includes(initPage) ? initPage : 'dashboard');

</script>
</body>
</html>
